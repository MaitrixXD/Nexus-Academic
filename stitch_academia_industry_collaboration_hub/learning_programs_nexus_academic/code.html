<script>
document.addEventListener('DOMContentLoaded', async () => {
    const courseGrid = document.querySelector('.grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-3');
    const user = getLoggedUser();

    const urlParams = new URLSearchParams(window.location.search);
    const searchVal = urlParams.get('search') || '';

    let enrolledIds = {};
    let completedIds = {};
    if (user && user.role === 'STUDENT') {
        try {
            const enrollRes = await nexusFetch('/learning-programs/my-enrollments');
            if (enrollRes.ok) {
                const enrollments = await enrollRes.json();
                enrollments.forEach(e => {
                    if (e.status === 'COMPLETED') {
                        completedIds[e.program.id] = true;
                    } else {
                        enrolledIds[e.program.id] = e.id;
                    }
                });
            }
        } catch (e) {
            console.error('Failed to load enrollments:', e);
        }
    }

    async function loadPrograms(filterSkill = '') {
        courseGrid.innerHTML = '<p class="text-body-md text-on-surface-variant col-span-3 text-center">Loading courses...</p>';
        try {
            let url = '/learning-programs';
            if (filterSkill || searchVal) {
                url += `?skill=${encodeURIComponent(filterSkill || searchVal)}`;
            }
            const res = await nexusFetch(url);
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.message || 'Failed to load courses');

            courseGrid.innerHTML = '';
            if (data.length === 0) {
                courseGrid.innerHTML = '<p class="text-body-md text-on-surface-variant col-span-3 text-center">No learning programs found.</p>';
                return;
            }

            data.forEach(course => {
                const tag = course.skillsCovered[0] || 'General';
                let btnHTML = '';

                if (user && user.role === 'STUDENT') {
                    if (completedIds[course.id]) {
                        btnHTML = `<span class="text-green-600 font-bold flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">verified</span> Completed</span>`;
                    } else if (enrolledIds[course.id]) {
                        btnHTML = `
                            <button onclick="completeCourse('${course.id}', this)" class="bg-tertiary text-on-tertiary px-4 py-2 rounded-lg text-label-md font-label-md hover:bg-opacity-90 transition-colors">
                                Complete
                            </button>
                        `;
                    } else {
                        btnHTML = `
                            <button onclick="enrollCourse('${course.id}', this)" class="bg-primary-container text-on-primary px-4 py-2 rounded-lg text-label-md font-label-md hover:bg-primary transition-colors">
                                Enroll
                            </button>
                        `;
                    }
                } else {
                    btnHTML = `<span class="text-on-surface-variant text-label-sm font-label-sm">Sign in to enroll</span>`;
                }

                courseGrid.innerHTML += `
                    <article class="bg-surface-container-lowest rounded-xl border border-[#DBEAFE] hover:border-primary-container transition-colors duration-300 overflow-hidden flex flex-col group relative shadow-[0_4px_10px_rgba(0,0,0,0.02)]">
                        <div class="h-40 bg-blue-50 w-full relative flex items-center justify-center p-6 border-b border-[#DBEAFE]">
                            <img alt="${course.title} Illustration" class="h-full object-contain mix-blend-multiply" src="${course.logoUrl || 'https://lh3.googleusercontent.com/aida-public/AB6AXuADNeESzHGpJwvE5gtcFO4DtUJX6vOVfAxN5GpakFFLNC65iPLoUA397khnm61oss1MuEsPwFpePnrdhubPnLHige81XzOOGyEMtYYumaMcPWmOZJv_4FtDjzA6lpa3HNhH5SliU1Y8qR697jFCR-LHI2U4Xc-95EjTfpDqQFchyEhgNwnbWTK9CkK4rvO2L7KfNDoSA0Zv8cP5T_uJovnX2BUAny45V7YjB3LpumazbNFA8d7T9Zyx'}"/>
                        </div>
                        <div class="p-8 flex flex-col flex-1">
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-[#F1F5F9] text-[#475569] px-2 py-1 rounded text-label-sm font-label-sm">${tag}</span>
                                <span class="text-secondary text-label-sm font-label-sm flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">schedule</span> ${course.duration}
                                </span>
                            </div>
                            <h3 class="text-headline-md font-headline-md text-on-surface mb-2 line-clamp-2">${course.title}</h3>
                            <p class="text-body-md font-body-md text-secondary mb-6 flex-1">${course.description}</p>
                            <div class="flex items-center justify-between mt-auto pt-4 border-t border-[#DBEAFE]">
                                <div class="flex items-center gap-2">
                                    <span class="material-symbols-outlined text-secondary">school</span>
                                    <span class="text-label-md font-label-md text-on-surface">${course.industry?.companyName || 'Nexus Partner'}</span>
                                </div>
                                ${btnHTML}
                            </div>
                        </div>
                    </article>
                `;
            });
        } catch (e) {
            console.error(e);
            courseGrid.innerHTML = '<p class="text-body-md text-error col-span-3 text-center">Error loading programs.</p>';
        }
    }

    window.enrollCourse = async (programId, btn) => {
        btn.disabled = true;
        btn.textContent = 'Enrolling...';
        try {
            const res = await nexusFetch(`/learning-programs/${programId}/enroll`, { method: 'POST' });
            if (!res.ok) throw new Error('Enrollment failed');
            alert('Successfully enrolled!');
            enrolledIds[programId] = true;
            loadPrograms();
        } catch (e) {
            alert(e.message);
            btn.disabled = false;
            btn.textContent = 'Enroll';
        }
    };

    window.completeCourse = async (programId, btn) => {
        btn.disabled = true;
        btn.textContent = 'Completing...';
        try {
            const res = await nexusFetch(`/learning-programs/${programId}/complete`, { method: 'PATCH' });
            const data = await res.json();
            if (!res.ok) throw new Error('Failed to mark course complete');
            
            alert('Congratulations! Course completed.' + (data.hasCertificate ? ' Your certificate has been auto-generated!' : ''));
            completedIds[programId] = true;
            delete enrolledIds[programId];
            loadPrograms();
        } catch (e) {
            alert(e.message);
            btn.disabled = false;
            btn.textContent = 'Complete';
        }
    };

    loadPrograms();

    const filterButtons = document.querySelectorAll('header button');
    filterButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            filterButtons.forEach(b => {
                b.className = "bg-surface-container-low text-on-secondary-container px-4 py-2 rounded-DEFAULT text-label-md font-label-md border border-outline-variant hover:border-primary-container transition-colors";
            });
            btn.className = "bg-primary-container text-on-primary px-4 py-2 rounded-DEFAULT text-label-md font-label-md shadow-sm transition-all hover:bg-primary";
            
            const skillFilter = btn.textContent.trim() === 'Technical' 
                ? 'Python' 
                : btn.textContent.trim() === 'Soft Skills' 
                    ? 'Communication' 
                    : '';
            loadPrograms(skillFilter);
        });
    });
});
</script>
