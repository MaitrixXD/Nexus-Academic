<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">

<!-- Brand -->

</div>
<!-- Tabs -->

</div>
<!-- Role Selector -->
<div class="mb-lg">

<div class="flex flex-wrap gap-xs">
<button class="role-tab-active px-md py-sm rounded-full text-label-md font-label-md transition-colors">Student</button>
<button class="role-tab-inactive px-md py-sm rounded-full text-label-md font-label-md transition-colors">Industry</button>

<button class="role-tab-inactive px-md py-sm rounded-full text-label-md font-label-md transition-colors">Institution</button>
</div>
</div>
<!-- Form -->
<form class="space-y-md">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs" for="email">Email or Phone</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-md px-md py-sm focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim transition-shadow outline-none text-body-md" id="email" placeholder="Enter your credentials" type="text"/>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-md px-md py-sm focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim transition-shadow outline-none text-body-md" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="pt-base flex flex-col gap-sm">
<div class="mt-xs mb-xs bg-surface-container-low p-sm rounded-lg border border-outline-variant/30 flex flex-col gap-xs">
<span class="block text-label-sm font-label-sm text-on-surface-variant font-semibold">Quick Demo Login</span>
<div class="flex flex-wrap gap-xs">
<button type="button" onclick="quickLogin('STUDENT')" class="bg-primary-container text-on-primary-container px-sm py-xs rounded text-label-sm hover:opacity-90 transition-opacity">As Student</button>
<button type="button" onclick="quickLogin('INDUSTRY')" class="bg-secondary-container text-on-secondary-container px-sm py-xs rounded text-label-sm hover:opacity-90 transition-opacity">As Industry</button>
<button type="button" onclick="quickLogin('ACADEMICIAN')" class="bg-tertiary-container text-on-tertiary-container px-sm py-xs rounded text-label-sm hover:opacity-90 transition-opacity">As Academician</button>
<button type="button" onclick="quickLogin('INSTITUTION_ADMIN')" class="bg-surface-variant text-on-surface-variant px-sm py-xs rounded text-label-sm hover:opacity-90 transition-opacity">As Admin</button>
</div>
</div>

<span class="material-symbols-outlined text-[18px]">school</span>

<!-- Suppressing Footer for Login Flow -->
<script>
        let currentMode = 'login'; // 'login' or 'signup'
        let selectedRole = 'STUDENT'; // default role

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const actionButton = document.getElementById('main-login-btn');
        
        // Mode switching tabs
        const tabContainer = document.querySelector('.flex.gap-gutter.mb-lg');
        const tabs = tabContainer.querySelectorAll('button');
        const loginTab = tabs[0];
        const signupTab = tabs[1];

        // Error message banner injector
        function showError(message) {
            let errDiv = document.getElementById('auth-error');
            if (!errDiv) {
                errDiv = document.createElement('div');
                errDiv.id = 'auth-error';
                errDiv.className = 'bg-error-container text-on-error-container p-sm rounded-md text-label-md mb-md font-medium text-center';
                document.querySelector('form').prepend(errDiv);
            }
            errDiv.textContent = message;
            errDiv.classList.remove('hidden');
        }

        function clearError() {
            const errDiv = document.getElementById('auth-error');
            if (errDiv) errDiv.classList.add('hidden');
        }

        loginTab.addEventListener('click', (e) => {
            e.preventDefault();
            currentMode = 'login';
            loginTab.className = "pb-base text-headline-md font-headline-md text-primary border-b-2 border-primary";
            signupTab.className = "pb-base text-headline-md font-headline-md text-on-surface-variant hover:text-primary transition-colors";
            actionButton.textContent = "Login";
            clearError();
        });

        signupTab.addEventListener('click', (e) => {
            e.preventDefault();
            currentMode = 'signup';
            signupTab.className = "pb-base text-headline-md font-headline-md text-primary border-b-2 border-primary";
            loginTab.className = "pb-base text-headline-md font-headline-md text-on-surface-variant hover:text-primary transition-colors";
            actionButton.textContent = "Sign Up";
            clearError();
        });

        // Role mapping
        const roleMap = {
            'Student': 'STUDENT',
            'Industry': 'INDUSTRY',
            'Academician': 'ACADEMICIAN',
            'Institution': 'INSTITUTION_ADMIN'
        };

        // Role tab selection
        const roleButtons = document.querySelectorAll('.role-tab-inactive, .role-tab-active');
        roleButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                // Reset all
                roleButtons.forEach(b => {
                    b.classList.remove('role-tab-active');
                    b.classList.add('role-tab-inactive');
                });
                // Set clicked
                const target = e.currentTarget || e.target;
                target.classList.remove('role-tab-inactive');
                target.classList.add('role-tab-active');
                
                selectedRole = roleMap[target.textContent.trim()];
            });
        });

        const demoCredentials = {
            STUDENT: { email: 'alex.chen@student.iit-nexus.edu.in', password: 'Password@123' },
            INDUSTRY: { email: 'hr@techcorp.io', password: 'Password@123' },
            ACADEMICIAN: { email: 'prof.sharma@iit-nexus.edu.in', password: 'Password@123' },
            INSTITUTION_ADMIN: { email: 'admin@iit-nexus.edu.in', password: 'Password@123' }
        };

        window.quickLogin = async (role) => {
            clearError();
            const creds = demoCredentials[role];
            if (!creds) return;

            // Autofill
            emailInput.value = creds.email;
            passwordInput.value = creds.password;

            // Highlight corresponding role button in UI
            selectedRole = role;
            const roleNames = {
                STUDENT: 'Student',
                INDUSTRY: 'Industry',
                ACADEMICIAN: 'Academician',
                INSTITUTION_ADMIN: 'Institution'
            };
            roleButtons.forEach(b => {
                if (b.textContent.trim() === roleNames[role]) {
                    b.classList.remove('role-tab-inactive');
                    b.classList.add('role-tab-active');
                } else {
                    b.classList.remove('role-tab-active');
                    b.classList.add('role-tab-inactive');
                }
            });

            // Perform Login
            await performLogin(creds.email, creds.password);
        };

        async function performLogin(email, password) {
            actionButton.disabled = true;
            actionButton.textContent = 'Logging in...';

            try {
                const endpoint = currentMode === 'login' ? '/auth/login' : '/auth/register';
                const payload = currentMode === 'login' 
                    ? { email, password } 
                    : { email, password, role: selectedRole };

                const response = await fetch(`${window.API_BASE || 'http://127.0.0.1:3001/api/v1'}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Authentication failed');
                }

                // Save tokens & profile details
                localStorage.setItem('nexus_access_token', data.accessToken);
                localStorage.setItem('nexus_refresh_token', data.refreshToken);
                localStorage.setItem('nexus_user', JSON.stringify(data.user));

                // Routing path dictionary
                const dashboardRoutes = {
                    STUDENT: '../student_dashboard_nexus_academic/code.html',
                    INDUSTRY: '../industry_dashboard_nexus_academic/code.html',
                    ACADEMICIAN: '../academician_dashboard_nexus_academic/code.html',
                    INSTITUTION_ADMIN: '../institution_admin_dashboard_nexus_academic/code.html'
                };

                if (currentMode === 'signup') {
                    window.location.href = '../onboarding_welcome_to_nexus_academic/code.html';
                } else {
                    window.location.href = dashboardRoutes[data.user.role];
                }

            } catch (err) {
                showError(err.message);
                actionButton.disabled = false;
                actionButton.textContent = currentMode === 'login' ? 'Login' : 'Sign Up';
            }
        }

        // Submit action
        actionButton.addEventListener('click', async (e) => {
            e.preventDefault();
            clearError();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Please fill in all credentials.');
                return;
            }

            await performLogin(email, password);
        });
    </script>
