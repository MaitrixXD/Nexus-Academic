<script>
  document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value.trim();
    const title = document.getElementById('title').value.trim();
    const bio = document.getElementById('bio').value.trim();
    
    if (!fullName || !title) {
       alert('Please fill in required fields.');
       return;
    }
    
    const user = getLoggedUser();
    if (!user) {
       window.location.href = '../login_sign_up_nexus_academic/code.html';
       return;
    }
    
    const spaceIdx = fullName.indexOf(' ');
    const firstName = spaceIdx !== -1 ? fullName.substring(0, spaceIdx) : fullName;
    const lastName = spaceIdx !== -1 ? fullName.substring(spaceIdx + 1) : '';
    
    const payload = {
       firstName,
       lastName,
       bio,
       institution: title,
       department: 'Computer Science',
       year: 3,
       companyName: fullName,
       industry: title,
       location: 'Bangalore, India',
       designation: title
    };
    
    try {
       const response = await nexusFetch('/auth/onboarding', {
          method: 'POST',
          body: JSON.stringify(payload)
       });
       const data = await response.json();
       if (!response.ok) throw new Error(data.message || 'Onboarding failed');
       
       const updatedUser = { ...user, firstName, lastName };
       localStorage.setItem('nexus_user', JSON.stringify(updatedUser));
       
       const dashboardRoutes = {
           STUDENT: '../student_dashboard_nexus_academic/code.html',
           INDUSTRY: '../industry_dashboard_nexus_academic/code.html',
           ACADEMICIAN: '../academician_dashboard_nexus_academic/code.html',
           INSTITUTION_ADMIN: '../institution_admin_dashboard_nexus_academic/code.html'
       };
       window.location.href = dashboardRoutes[user.role];
    } catch(err) {
       alert(err.message);
    }
  });

  document.querySelector('.text-center.mt-md button').addEventListener('click', (e) => {
     e.preventDefault();
     const user = getLoggedUser();
     if (!user) {
        window.location.href = '../login_sign_up_nexus_academic/code.html';
        return;
     }
     const dashboardRoutes = {
         STUDENT: '../student_dashboard_nexus_academic/code.html',
         INDUSTRY: '../industry_dashboard_nexus_academic/code.html',
         ACADEMICIAN: '../academician_dashboard_nexus_academic/code.html',
         INSTITUTION_ADMIN: '../institution_admin_dashboard_nexus_academic/code.html'
     };
     window.location.href = dashboardRoutes[user.role];
  });
</script>
